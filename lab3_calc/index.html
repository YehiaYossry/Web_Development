<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iOS Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="calculator" aria-label="iOS Calculator layout">
    <h1>iOS Calculator</h1>

    <div class="display" id="display" aria-label="Calculator display">
      <span>0</span>
    </div>

    <section class="keypad" id="keypad" aria-label="Calculator keys">
      <button class="key key-light" type="button">AC</button>
      <button class="key key-dark" type="button">00</button>
      <button class="key key-dark" type="button">%</button>
      <button class="key key-operator" type="button">÷</button>

      <button class="key key-dark" type="button">7</button>
      <button class="key key-dark" type="button">8</button>
      <button class="key key-dark" type="button">9</button>
      <button class="key key-operator" type="button">×</button>

      <button class="key key-dark" type="button">4</button>
      <button class="key key-dark" type="button">5</button>
      <button class="key key-dark" type="button">6</button>
      <button class="key key-operator" type="button">−</button>

      <button class="key key-dark" type="button">1</button>
      <button class="key key-dark" type="button">2</button>
      <button class="key key-dark" type="button">3</button>
      <button class="key key-operator" type="button">+</button>

      <button class="key key-dark key-zero" type="button">0</button>
      <button class="key key-dark key-decimal" type="button">.</button>
      <button class="key key-operator" type="button">=</button>
    </section>
  </main>
  <script src="logic.js"></script>
</body>

</html>
